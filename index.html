<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="文章中のローマ数字を足して年号を読む、クロノグラムの解析と生成の学習ツール。">
  <meta name="author" content="ipusiron">
  <title>Epigraph Chronogrammer</title>
  <script src="preferences.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="app-header">
    <div class="header-actions"><button id="languageToggle" type="button" hidden>English</button><button id="themeToggle" type="button"></button></div>
    <h1>Epigraph Chronogrammer</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </header>
  <main class="container">
    <nav class="tabs" role="tablist" data-i18n-aria="tabs">
      <button id="tab-analyze" type="button" class="tab active" data-tab="analyze" role="tab" aria-controls="panel-analyze" aria-selected="true" data-i18n="analyze"></button>
      <button id="tab-generate" type="button" class="tab" data-tab="generate" role="tab" aria-controls="panel-generate" aria-selected="false" tabindex="-1" data-i18n="generate"></button>
      <button id="tab-compose" type="button" class="tab" data-tab="compose" role="tab" aria-controls="panel-compose" aria-selected="false" tabindex="-1" data-i18n="compose"></button>
      <button id="tab-study" type="button" class="tab" data-tab="study" role="tab" aria-controls="panel-study" aria-selected="false" tabindex="-1" data-i18n="study"></button>
    </nav>
    <section id="panel-analyze" class="panel active" role="tabpanel" tabindex="0" aria-labelledby="tab-analyze">
      <div class="panel-body">
        <div class="input-header"><label for="inputText" data-i18n="inputLabel"></label><button id="clearInputBtn" type="button" data-i18n="clear"></button></div>
        <textarea id="inputText" class="textarea" rows="5" maxlength="10000" aria-describedby="analysisStatus"></textarea>
        <div class="example-row"><span data-i18n="examples"></span><button type="button" class="example-btn" data-text="MilLe Domini Christi">MilLe Domini Christi</button><button type="button" class="example-btn" data-text="franCIs goLDsMIth">franCIs goLDsMIth</button></div>
        <fieldset class="radio-group"><legend data-i18n="extraction"></legend>
          <label><input type="radio" name="extractionMode" value="uppercase" checked><span data-i18n="uppercase"></span></label>
          <label><input type="radio" name="extractionMode" value="all"><span data-i18n="all"></span></label>
          <label><input type="radio" name="extractionMode" value="positional"><span data-i18n="positional"></span></label>
        </fieldset>
        <details><summary data-i18n="extractionHelp"></summary><p data-i18n="extractionDetail"></p></details>
        <div class="btn-row"><button id="analyzeBtn" type="button" class="btn primary" data-i18n="analyze"></button></div>
        <p id="analysisStatus" class="status" role="status"></p>
        <div id="analysisResults" hidden>
          <h2 data-i18n="highlighted"></h2><div id="highlightView" class="highlight-view"></div>
          <div class="section-header"><h2 data-i18n="extracted"></h2><button id="copyExtractBtn" type="button" data-i18n="copyExtract" disabled></button></div>
          <div class="card"><div id="extractedLetters" class="mono bounded"></div><p id="letterCounts" class="mono"></p></div>
          <div class="card result-card"><h2 data-i18n="sumHeading"></h2><div id="sumBreakdown" class="mono"></div><div id="sumTotal" class="result-value mono"></div><p id="sumRoman"></p><p data-i18n="sumNote"></p></div>
        </div>
        <details class="puzzle-settings" id="puzzleDetails"><summary data-i18n="puzzle"></summary>
          <p data-i18n="puzzleNote"></p>
          <fieldset><legend data-i18n="range"></legend><div class="range-row">
            <label for="minYear"><span data-i18n="minYear"></span><input id="minYear" class="input" inputmode="numeric" value="1500" aria-describedby="analysisStatus"></label>
            <label for="maxYear"><span data-i18n="maxYear"></span><input id="maxYear" class="input" inputmode="numeric" value="2100" aria-describedby="analysisStatus"></label>
          </div><div class="preset-row">
            <button type="button" data-century="16" data-range="1501,1600"></button><button type="button" data-century="17" data-range="1601,1700"></button><button type="button" data-century="18" data-range="1701,1800"></button><button type="button" data-century="19" data-range="1801,1900"></button><button type="button" data-century="20" data-range="1901,2000"></button><button type="button" data-century="21" data-range="2001,2100"></button>
          </div></fieldset>
          <fieldset class="radio-group"><legend data-i18n="match"></legend><label><input type="radio" name="anagramMode" value="subset" checked><span data-i18n="subset"></span></label><label><input type="radio" name="anagramMode" value="exact"><span data-i18n="exact"></span></label></fieldset>
          <p data-i18n="exactHelp"></p><p id="anagramSummary"></p><div id="anagramCandidates" class="tags"></div>
        </details>
        <p class="notice" data-i18n="limits"></p>
      </div>
    </section>
    <section id="panel-generate" class="panel" role="tabpanel" tabindex="0" aria-labelledby="tab-generate" hidden>
      <div class="panel-body">
        <p data-i18n="generationNote"></p>
        <label for="yearToMake" data-i18n="year"></label><input id="yearToMake" class="input year-input" inputmode="numeric" value="2025" aria-describedby="generationStatus">
        <div class="btn-row"><button id="makeChronogramBtn" type="button" class="btn primary" data-i18n="make"></button><button id="copyGeneratedBtn" type="button" data-i18n="copyAll" disabled></button></div>
        <p id="generationStatus" class="status" role="status"></p><p id="romanForYear" class="mono"></p><p id="extendedRoman" data-i18n="extendedRoman" hidden></p><div id="generatedExamples" class="gen-grid"></div>
      </div>
    </section>
    <section id="panel-compose" class="panel" role="tabpanel" tabindex="0" aria-labelledby="tab-compose" hidden>
      <div class="panel-body">
        <p data-i18n="composeIntro"></p>
        <label for="composeYear" data-i18n="year"></label>
        <input id="composeYear" class="input year-input" inputmode="numeric" value="2024" aria-describedby="composeStatus">
        <div class="input-header"><label for="composeText" data-i18n="draftLabel"></label></div>
        <textarea id="composeText" class="textarea" rows="4" maxlength="10000" aria-describedby="composeHelp"></textarea>
        <div class="btn-row">
          <button id="composeUndo" type="button" data-i18n="undo" disabled></button>
          <button id="composeClear" type="button" data-i18n="clear" disabled></button>
          <button id="composeCopy" type="button" data-i18n="copyDraft" disabled></button>
          <button id="composeMemoCopy" type="button" data-i18n="copyMemo" disabled></button>
        </div>
        <p id="composeStatus" class="status" role="status"></p>
        <p id="composeHint" class="mono"></p>
        <p id="composeHelp" data-i18n="composeHelp"></p>
        <div id="composePreview" class="compose-preview" role="group" data-i18n-aria="letterControls"></div>
        <div class="btn-row" id="composePaging" hidden>
          <button id="composePrevious" type="button" data-i18n="previousPage"></button>
          <span id="composePageInfo"></span>
          <button id="composeNext" type="button" data-i18n="nextPage"></button>
        </div>
        <p id="composeCounts" class="mono"></p>
        <details id="composeMemoDetails"><summary data-i18n="memoHeading"></summary>
          <label for="composeMemo" data-i18n="memoLabel"></label>
          <textarea id="composeMemo" class="textarea mono" rows="7" readonly></textarea>
        </details>
        <p class="notice" data-i18n="composeLimits"></p>
      </div>
    </section>
    <section id="panel-study" class="panel" role="tabpanel" tabindex="0" aria-labelledby="tab-study" hidden>
      <article class="panel-body prose"><p data-i18n="studyIntro"></p>
        <details open><summary data-i18n="study1"></summary><p data-i18n="study1body"></p></details>
        <details><summary data-i18n="study2"></summary><p data-i18n="study2body"></p></details>
        <details><summary data-i18n="study3"></summary><p data-i18n="study3body"></p><ul><li><a href="https://www.folger.edu/blogs/collation/time-writing/" target="_blank" rel="noopener noreferrer" data-i18n="folger"></a></li><li><a href="https://rism.info/fr/library_collections/2023/06/22/a-numerical-riddle-chronogram-in-a-musical-manuscript.html" target="_blank" rel="noopener noreferrer" data-i18n="rism"></a></li></ul></details>
        <details><summary data-i18n="study4"></summary><p data-i18n="study4body"></p></details>
        <details><summary data-i18n="study5"></summary><p data-i18n="study5body"></p></details>
        <details><summary data-i18n="study6"></summary><p data-i18n="study6body"></p></details>
      </article>
    </section>
    <p id="copyStatus" class="status" role="status"></p>
    <noscript><p>JavaScript is required. JavaScriptを有効にしてご利用ください。</p></noscript>
  </main>
  <footer><a href="https://github.com/ipusiron/epigraph-chronogrammer" target="_blank" rel="noopener noreferrer" data-i18n="footer"></a></footer>
  <script src="core.js"></script><script src="state.js"></script>
  <script src="composer-core.js"></script><script src="composer-state.js"></script>
  <script src="messages.js"></script><script src="script.js"></script>
</body>
</html>
